name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v2.2.0)"
        required: false
        default: "v2.2.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Windows Toolchain & FFmpeg Dev Libraries
        shell: powershell
        run: |
          $ffmpegZip = "$env:TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip" -OutFile $ffmpegZip
          Expand-Archive -Path $ffmpegZip -DestinationPath "C:\ffmpeg-extract"
          $extractedDir = Get-ChildItem "C:\ffmpeg-extract" | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          Move-Item -Path $extractedDir.FullName -Destination "C:\ffmpeg"

          "C:\ffmpeg\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "FFMPEG_DIR=C:\ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=C:\ffmpeg\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: dtolnay/rust-toolchain@stable

      - name: Build & Package Windows Release
        shell: powershell
        run: |
          .\scripts\package_rust_release.ps1 -PackageName "TackleCast-Windows-x86_64" -Zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TackleCast-Windows-x86_64
          path: dist/TackleCast-Windows-x86_64.zip

  build-linux:
    name: Build Linux Release (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libv4l-dev \
            libavcodec-dev \
            libavformat-dev \
            libavdevice-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            libclang-dev \
            clang \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Build & Package Linux Release
        run: |
          chmod +x scripts/package_linux_release.sh scripts/run.sh
          ./scripts/package_linux_release.sh

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TackleCast-Linux-x86_64
          path: dist/TackleCast-Linux-x86_64.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: TackleCast-Windows-x86_64
          path: release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: TackleCast-Linux-x86_64
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
